<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Orders - Perfect Pizza</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="nav-logo">
        <span>🍕 Perfect <span class="dot">Pizza</span></span>
      </a>
      <nav class="nav-links">
        <a href="menu.html">Menu</a>
      
        <a href="cart.html" class="cart-link">
          Cart <span class="cart-count" data-cart-count>0</span>
        </a>
        <a href="login.html" data-login-link>Login</a>
        <a href="#" data-logout-link style="display:none">Logout</a>
        <span class="text-small" data-user-name></span>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-heading">
      <div>
        <h1>My Orders</h1>
        <p>Recent pizza orders aur unka status yahan dekhein.</p>
      </div>
    </div>

    <div id="orders-loading" class="loading">Loading your orders...</div>
    <div id="orders-empty" class="empty-state" style="display:none">
      <h2>No orders yet</h2>
      <p>Sabse pehle perfect pizza order karein!</p>
      <a href="menu.html" class="btn btn-primary">Browse Menu</a>
    </div>

    <section id="orders-list" class="orders-list"></section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
    <!-- Socket.IO client from backend -->
  <script src="https://perfect-pizza-pa9n.onrender.com"></script>
  <script src="js/socket.js"></script>

  <script src="js/orders.js"></script>
</body>
</html>
