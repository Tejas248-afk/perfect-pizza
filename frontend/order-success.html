<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Order Summary - Perfect Pizza</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="nav-logo">
        <span>🍕 Perfect <span class="dot">Pizza</span></span>
      </a>
      <nav class="nav-links">
        <a href="menu.html">Menu</a>
        <a href="cart.html" class="cart-link">
          Cart <span class="cart-count" data-cart-count>0</span>
        </a>
        <a href="login.html" data-login-link>Login</a>
        <a href="#" data-logout-link style="display:none">Logout</a>
        <span class="text-small" data-user-name></span>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-heading">
      <div>
        <h1>Order Summary</h1>
        <p>Thank you for your order. Here are your order details.</p>
      </div>
      <button class="btn btn-secondary" onclick="window.print()">
        Print / Save as PDF
      </button>
    </div>

    <section id="invoice" class="invoice-card">
      <p>Loading order details...</p>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/order-success.js"></script>
</body>
</html>
