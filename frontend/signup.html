<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign up - Perfect Pizza</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="nav-logo">
        <span>🍕 Perfect <span class="dot">Pizza</span></span>
      </a>
      <nav class="nav-links">
        <a href="menu.html">Menu</a>
        <a href="login.html">Login</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="auth-card">
      <h1>Create Account</h1>
      <p class="subtitle">
        Customers now sign up and log in using a mobile OTP.
      </p>

      <p class="text-small" style="margin-top: 1rem">
        Enter your mobile number on the login page and verify with OTP to create
        your Perfect Pizza account instantly.
      </p>

      <button
        type="button"
        class="btn btn-primary"
        style="width: 100%; margin-top: 1.5rem"
        onclick="window.location.href='login.html'"
      >
        Continue to Login (OTP)
      </button>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
