<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Customers - Perfect Pizza</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<header class="navbar">
  <div class="navbar-inner">
    <div class="nav-logo">
      <span>🍕 Perfect <span class="dot">Pizza</span> Admin</span>
    </div>
    <nav class="nav-links">
  <select id="admin-outlet-select" class="nav-outlet-select">
    <option value="">All Outlets</option>
  </select>

  <a href="/admin/products.html">Menu Items</a>
  <a href="/admin/outlets.html">Outlets</a>
  <a href="/admin/customers.html">Customers</a>
  <a href="/admin/delivery-rules.html">Delivery Rules</a>
  <a href="/admin/coupons.html">Coupons</a>

  <a href="/login.html" data-login-link>Login</a>
  <a href="#" data-logout-link style="display:none">Logout</a>
  <span class="text-small" data-user-name></span>
</nav>
  </div>
</header>

<main class="container">
  <div class="page-heading">
    <div>
      <h1>Customers</h1>
      <p>Registered customers with reward balance and order stats.</p>
    </div>
  </div>

  <section class="order-section">
    <div
      id="admin-customers-loading"
      class="loading"
    >
      Loading customers...
    </div>

    <div
      id="admin-customers-empty"
      class="empty-state"
      style="display:none"
    >
      <p>No customers yet.</p>
    </div>

    <table
      id="admin-customers-table"
      class="text-small"
      style="width:100%;border-collapse:collapse"
    >
      <thead>
        <tr>
          <th>Name</th>
          <th>Contact</th>
          <th>Member since</th>
          <th>Total orders</th>
          <th>Total spend</th>
          <th>Coins</th>
        </tr>
      </thead>
      <tbody id="admin-customers-body"></tbody>
    </table>
  </section>
</main>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
