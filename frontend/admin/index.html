<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard - Perfect Pizza</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<header class="navbar">
  <div class="navbar-inner">
    <div class="nav-logo">
      <span>🍕 Perfect <span class="dot">Pizza</span> Admin</span>
    </div>
    <nav class="nav-links">
      <!-- YE teen hi links chahiye -->
      <a href="/admin/products.html">Menu Items</a>
      <a href="/admin/customers.html">Customers</a>
      <a href="/admin/delivery-rules.html">Delivery Rules</a>
        <a href="/admin/coupons.html">Coupons</a>

      <a href="/login.html" data-login-link>Login</a>
      <a href="#" data-logout-link style="display:none">Logout</a>
      <span class="text-small" data-user-name></span>
    </nav>
  </div>
</header>

  <main class="container" id="admin-overview">
    <div class="page-heading">
      <div>
        <h1>Admin Dashboard</h1>
        <p>Today&apos;s snapshot for Perfect Pizza – Singhpur Chauraha.</p>
      </div>
    </div>

    <section class="order-section">
      <div class="orders-list" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0.9rem;">
        <article class="order-card">
          <div class="order-card-main">
            <div>
              <div class="order-id">Today&apos;s Orders</div>
              <div class="order-amount" id="admin-today-orders">0</div>
            </div>
          </div>
        </article>

        <article class="order-card">
          <div class="order-card-main">
            <div>
              <div class="order-id">Today&apos;s Sales</div>
              <div class="order-amount" id="admin-today-sales">₹0</div>
            </div>
          </div>
        </article>

        <article class="order-card">
          <div class="order-card-main">
            <div>
              <div class="order-id">Pending Orders</div>
              <div class="order-amount" id="admin-today-pending">0</div>
            </div>
          </div>
        </article>

        <article class="order-card">
          <div class="order-card-main">
            <div>
              <div class="order-id">Delivered Today</div>
              <div class="order-amount" id="admin-today-delivered">0</div>
            </div>
          </div>
        </article>

        <article class="order-card">
          <div class="order-card-main">
            <div>
              <div class="order-id">Total Customers</div>
              <div class="order-amount" id="admin-total-customers">0</div>
            </div>
          </div>
        </article>
      </div>
    </section>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
