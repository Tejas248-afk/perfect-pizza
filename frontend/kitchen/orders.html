<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kitchen Orders - Perfect Pizza</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="navbar-inner">
      <div class="nav-logo">
        <span>🍕 Perfect <span class="dot">Pizza</span> - Kitchen</span>
      </div>
      <nav class="nav-links">
        <a href="orders.html">Orders</a>
        <a href="../login.html" data-login-link>Login</a>
        <a href="#" data-logout-link style="display:none">Logout</a>
        <span class="text-small" data-user-name></span>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-heading">
      <div>
        <h1>Kitchen Dashboard</h1>
        <p>New, active aur completed orders yahan handle karein.</p>
      </div>
    </div>

    <div class="menu-filters" style="margin-bottom:1rem">
      <button class="btn btn-secondary" data-filter="active">
        Active Orders
      </button>
      <button class="btn btn-secondary" data-filter="new">
        New (PLACED)
      </button>
      <button class="btn btn-secondary" data-filter="completed">
        Completed
      </button>
    </div>

    <div id="kitchen-loading" class="loading">Loading orders...</div>
    <div id="kitchen-empty" class="empty-state" style="display:none">
      <h2>No orders</h2>
      <p>Abhi kitchen ke liye koi order pending nahi hai.</p>
    </div>

    <section id="kitchen-orders" class="orders-list"></section>
  </main>
